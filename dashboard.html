<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker - Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 0; }
        header { background-color: #007bff; color: white; padding: 15px; text-align: center; }
        main { padding: 20px; }
        h2 { margin-top: 0; }
        ul { list-style-type: none; padding: 0; }
        li { background: white; padding: 15px; margin-bottom: 10px; border-radius: 5px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
        .logout { float: right; color: white; text-decoration: none; }
        .logout:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        Task Tracker Dashboard
        <a href="login.html" class="logout">Logout</a>
    </header>
    <main>
        <h2>My Tasks</h2>
        <ul>
            <li>Complete project documentation</li>
            <li>Review pull requests</li>
            <li>Update login feature</li>
            <li>Plan sprint tasks</li>
        </ul>
    </main>
</body>
</html>
